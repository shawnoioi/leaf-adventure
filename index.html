<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102b28" />
  <title>叶片冒险 · Mosslight Run</title>
  <style>
    :root { color-scheme: dark; --ink:#edf4dc; --muted:#a4b4a0; --lime:#d7fa71; --panel:#173632; --line:rgba(226,245,203,.13); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Nunito,ui-rounded,system-ui,sans-serif; background:#102b28; background-image:radial-gradient(ellipse at 50% 0%,#245044 0%,transparent 54%),linear-gradient(180deg,#102b28,#0d2423); display:grid; place-items:center; padding:28px 20px 38px; }
    .shell { width:min(1120px,100%); }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:0 0 18px; }
    .brand { display:flex; align-items:center; gap:13px; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:13px; background:#d7fa71; color:#17352b; box-shadow:0 5px 0 #98bd48; font-size:23px; transform:rotate(-8deg); }
    .eyebrow,.mono { font-family:'DM Mono',monospace; letter-spacing:.11em; text-transform:uppercase; }
    .eyebrow { color:#a8c5a5; font-size:10px; margin:0 0 3px; }
    h1 { font-size:22px; line-height:1; letter-spacing:-.03em; margin:0; }
    .chapter { display:flex; align-items:center; gap:9px; color:#b6c8b4; font:11px 'DM Mono',monospace; letter-spacing:.08em; }
    .chapter .dot { width:7px; height:7px; background:#d7fa71; border-radius:50%; box-shadow:0 0 12px #d7fa7180; }
    .game-frame { border:1px solid rgba(224,246,211,.2); border-radius:18px; background:#183932; padding:9px; box-shadow:0 25px 70px #07161399,0 2px 0 #ffffff10 inset; }
    .hud { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; }
    .hud-left,.hud-right { display:flex; align-items:center; gap:22px; }
    .hud-item { display:flex; align-items:center; gap:8px; color:#aec1b1; font:10px 'DM Mono',monospace; letter-spacing:.09em; text-transform:uppercase; }
    .hud-item strong { color:#eff7e2; font:700 13px 'DM Mono',monospace; letter-spacing:0; }
    .hud-item .icon { font-size:14px; color:#d7fa71; }
    .level-tag { border:1px solid #d7fa7130; border-radius:20px; padding:6px 10px; color:#d7fa71; font:10px 'DM Mono',monospace; letter-spacing:.07em; }
    .viewport { position:relative; overflow:hidden; border-radius:10px; aspect-ratio:16/9; background:#a7d7a4; }
    canvas { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
    .screen { position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(90deg,#0d2825c9,#14342bb8); text-align:center; padding:24px; transition:opacity .25s ease; }
    .screen.hidden { opacity:0; pointer-events:none; }
    .screen-card { max-width:460px; transform:translateY(2px); }
    .screen-kicker { color:#d7fa71; font:10px 'DM Mono',monospace; letter-spacing:.2em; text-transform:uppercase; margin-bottom:12px; }
    .screen h2 { font-size:clamp(30px,5vw,52px); line-height:.98; letter-spacing:-.055em; margin:0 0 12px; text-shadow:0 4px 0 #17372e; }
    .screen p { max-width:350px; margin:0 auto 20px; color:#d3e2cf; font-size:14px; line-height:1.65; }
    .play-btn { appearance:none; border:0; cursor:pointer; border-radius:9px; padding:12px 20px; color:#1a3428; background:#d7fa71; box-shadow:0 4px 0 #99bf48; font:900 13px Nunito,sans-serif; letter-spacing:.02em; transition:transform .12s,box-shadow .12s; }
    .play-btn:hover { transform:translateY(-2px); box-shadow:0 6px 0 #99bf48; }
    .play-btn:active { transform:translateY(2px); box-shadow:0 2px 0 #99bf48; }
    .key-note { margin-top:15px; color:#bdd0bd; font:10px 'DM Mono',monospace; letter-spacing:.04em; }
    .key { display:inline-block; min-width:22px; padding:3px 5px; border:1px solid #d7fa7150; border-radius:4px; color:#e9f7d2; background:#f3ffe20b; margin:0 2px; }
    .bottom-row { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:13px 5px 0; color:#93aa98; font:10px 'DM Mono',monospace; letter-spacing:.06em; }
    .bottom-row span { display:flex; align-items:center; gap:7px; }
    .bottom-row b { color:#c4d5bf; font-weight:500; }
    .bottom-row .tip { color:#bfd18b; }
    @media(max-width:620px) { body{padding:18px 12px 24px}.chapter{font-size:9px}.hud{padding:0 7px}.hud-left,.hud-right{gap:10px}.hud-item{font-size:8px;gap:5px}.hud-item strong{font-size:11px}.level-tag{font-size:8px;padding:5px 7px}.bottom-row{font-size:8px}.game-frame{padding:6px;border-radius:14px} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="brand-mark">✦</div><div><p class="eyebrow">A tiny forest platformer</p><h1>叶片冒险</h1></div></div>
      <div class="chapter"><span class="dot"></span> CHAPTER 01 <span style="color:#6e9184">/</span> MOSSY TRAIL</div>
    </header>
    <section class="game-frame" aria-label="叶片冒险游戏">
      <div class="hud">
        <div class="hud-left">
          <div class="hud-item"><span class="icon">✦</span> DEW <strong id="score">00</strong></div>
          <div class="hud-item"><span class="icon">♥</span> LIFE <strong id="life">03</strong></div>
        </div>
        <div class="hud-right"><div class="hud-item">BEST <strong id="best">00</strong></div><span class="level-tag">FOREST · 1-1</span></div>
      </div>
      <div class="viewport" id="viewport">
        <canvas id="game" width="960" height="540" aria-label="横版平台跳跃游戏画面"></canvas>
        <div class="screen" id="screen">
          <div class="screen-card">
            <div class="screen-kicker" id="screen-kicker">A LEAF'S LITTLE JOURNEY</div>
            <h2 id="screen-title">嘎嘎姑姑</h2>
            <p id="screen-copy">穿过青苔小径，收集露珠，躲开巡游的小蘑菇。每一次轻跳，都离终点更近一点。</p>
            <button class="play-btn" id="play">开始冒险&nbsp; ↗</button>
            <div class="key-note"><span class="key">←</span><span class="key">→</span> 移动 <span style="padding:0 4px;color:#809786">·</span> <span class="key">SPACE</span> 跳跃</div>
          </div>
        </div>
      </div>
    </section>
    <div class="bottom-row"><span class="tip">✦ <b>踩到蘑菇头上可以弹得更高</b></span><span><b>A / D</b> 或方向键移动 &nbsp;·&nbsp; <b>W</b> 或空格跳跃</span></div>
  </main>
  <script>
  (() => {
    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
    const W = 960, H = 540, WORLD = 3600, FLOOR = 462;
    const scoreEl = document.getElementById('score'), lifeEl = document.getElementById('life'), bestEl = document.getElementById('best');
    const screen = document.getElementById('screen'), title = document.getElementById('screen-title'), copy = document.getElementById('screen-copy'), kicker = document.getElementById('screen-kicker'), play = document.getElementById('play');
    const readBest = () => { try { return Number(localStorage.getItem('leaf-best') || 0); } catch { return 0; } };
    const writeBest = value => { try { localStorage.setItem('leaf-best', String(value)); } catch {} };
    let state = 'ready', last = 0, camera = 0, score = 0, lives = 3, best = readBest(), time = 0;
    let keys = Object.create(null), pressed = Object.create(null);
    bestEl.textContent = String(best).padStart(2, '0');
    const player = { x:70, y:FLOOR-38, w:32, h:30, vx:0, vy:0, grounded:false, facing:1, invuln:0, anim:0 };
    const platforms = [
      {x:0,y:FLOOR,w:570,h:120},{x:660,y:FLOOR,w:425,h:120},{x:1170,y:FLOOR,w:520,h:120},{x:1770,y:FLOOR,w:410,h:120},{x:2270,y:FLOOR,w:490,h:120},{x:2850,y:FLOOR,w:750,h:120},
      {x:240,y:365,w:116,h:18},{x:420,y:302,w:110,h:18},{x:730,y:370,w:128,h:18},{x:920,y:310,w:112,h:18},{x:1250,y:366,w:140,h:18},{x:1465,y:300,w:116,h:18},{x:1840,y:365,w:122,h:18},{x:2032,y:302,w:110,h:18},{x:2350,y:366,w:120,h:18},{x:2540,y:302,w:130,h:18},{x:2980,y:367,w:140,h:18},{x:3200,y:305,w:135,h:18}
    ];
    const dewSpots = [[280,325],[455,262],[525,262],[770,330],[820,330],[962,270],[1285,326],[1340,326],[1500,260],[1550,260],[1870,325],[1925,325],[2055,262],[2400,326],[2450,326],[2580,262],[2630,262],[3015,327],[3065,327],[3240,265],[3295,265],[3410,420]].map(([x,y],i)=>({x,y,got:false,phase:i*1.7}));
    const enemySeed = [{x:470,min:405,max:535},{x:845,min:700,max:1040},{x:1330,min:1200,max:1640},{x:1950,min:1800,max:2150},{x:2480,min:2300,max:2730},{x:3100,min:2880,max:3500}];
    let enemies = [];
    function resetWorld() {
      player.x=70; player.y=FLOOR-player.h; player.vx=0; player.vy=0; player.grounded=false; player.invuln=0; player.facing=1;
      camera=0; time=0; dewSpots.forEach(d=>d.got=false); enemies=enemySeed.map((e,i)=>({...e,w:30,h:28,y:FLOOR-28,vx:i%2?-.75:.75,alive:true,phase:i}));
    }
    function startGame(){score=0;lives=3;resetWorld();updateHud();state='playing';screen.classList.add('hidden');}
    function updateHud(){scoreEl.textContent=String(score).padStart(2,'0');lifeEl.textContent=String(lives).padStart(2,'0');bestEl.textContent=String(best).padStart(2,'0');}
    function showEnd(kind){state=kind;screen.classList.remove('hidden');if(kind==='won'){kicker.textContent='TRAIL COMPLETE';title.textContent='咕咕嘎嘎';copy.textContent=`你带着 ${score} 颗露珠，成功穿过了青苔小径。风还会继续吹，下一段旅程等着你。`;play.textContent='再玩一次  ↗';}else{kicker.textContent='TAKE A BREATH';title.innerHTML='风停了一小会儿';copy.textContent=`这趟旅程收集了 ${score} 颗露珠。深呼吸，再出发吧。`;play.textContent='重新出发  ↗';}}
    play.addEventListener('click',startGame);
    window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','w','a','d'].includes(k)){e.preventDefault();if(!keys[k])pressed[k]=true;keys[k]=true;} if((k==='enter'||k===' ')&&state!=='playing'){if(k===' ')return;startGame();}});
    window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
    window.addEventListener('blur',()=>{keys=Object.create(null);pressed=Object.create(null);});
    function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
    function update(dt){
      if(state!=='playing')return;
      time+=dt; const left=keys.arrowleft||keys.a, right=keys.arrowright||keys.d, jump=pressed[' ']||pressed.w||pressed.arrowup;
      const accel=0.72*dt, max=4.4;
      if(left){player.vx=Math.max(-max,player.vx-accel);player.facing=-1;}else if(right){player.vx=Math.min(max,player.vx+accel);player.facing=1;}else player.vx*=Math.pow(.78,dt);
      if(Math.abs(player.vx)<.05)player.vx=0;
      if(jump&&player.grounded){player.vy=-12.8;player.grounded=false;}
      player.x+=player.vx*dt; player.x=Math.max(0,Math.min(WORLD-player.w,player.x));
      const oldBottom=player.y+player.h; player.vy=Math.min(13,player.vy+.58*dt);player.y+=player.vy*dt;player.grounded=false;
      for(const p of platforms){if(player.vy>=0&&oldBottom<=p.y+2&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.grounded=true;}}
      if(player.y>H+120){hurt();}
      if(player.invuln>0)player.invuln-=dt;
      for(const d of dewSpots){if(!d.got&&Math.abs((player.x+player.w/2)-d.x)<23&&Math.abs((player.y+player.h/2)-(d.y+Math.sin(time*.08+d.phase)*3))<26){d.got=true;score++;if(score>best){best=score;writeBest(best);}updateHud();}}
      for(const e of enemies){if(!e.alive)continue;e.x+=e.vx*dt;if(e.x<e.min||e.x+e.w>e.max)e.vx*=-1;
        if(rects(player,e)){if(player.vy>1&&oldBottom<=e.y+11){e.alive=false;player.y=e.y-player.h;player.vy=-8.7;score+=2;if(score>best){best=score;writeBest(best);}updateHud();}else if(player.invuln<=0){hurt();}}
      }
      const goalX=3490;if(player.x+player.w>=goalX){state='won';showEnd('won');}
      player.anim+=Math.abs(player.vx)*.07*dt;
      camera=Math.max(0,Math.min(WORLD-W,(player.x-W*.34)));
      pressed=Object.create(null);
    }
    function hurt(){lives--;updateHud();if(lives<=0){showEnd('lost');return;}player.x=Math.max(35,player.x-120);player.y=FLOOR-player.h-40;player.vx=0;player.vy=-3;player.invuln=100;}
    function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
    function drawBackground(){
      const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#bde5b7');sky.addColorStop(.6,'#d3e9ad');sky.addColorStop(1,'#a2ce8c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
      // Warm pixel sun and drifting cloud puffs.
      rect(752,67,55,7,'#fff0a8');rect(744,74,71,34,'#ffe99a');rect(752,108,55,7,'#f2d986');rect(767,59,25,8,'#fff0a8');
      for(let i=0;i<5;i++){let x=((i*250-time*.13-camera*.12)%(W+180)+W+180)%(W+180)-80;let y=80+(i%3)*45;rect(x+15,y,60,8,'#ecf2c0');rect(x,y+8,95,12,'#ecf2c0');rect(x+24,y+20,54,6,'#ecf2c0');}
      // Layered forest silhouettes move at different speeds.
      for(let layer=0;layer<3;layer++){let base=370+layer*28, size=105+layer*28, shift=(camera*(.13+layer*.12))%(size*1.5);for(let x=-size*2-shift;x<W+size;x+=size*1.3){let top=base-(layer===0?90:layer===1?48:10);rect(x+size*.28,top,size*.45,base-top,'#8cbb8e');rect(x+size*.05,top+22,size*.9,26,layer===0?'#8cbb8e':layer===1?'#78ad7e':'#659875');rect(x,top+45,size,24,layer===0?'#9bc995':layer===1?'#87b987':'#78a97d');rect(x+size*.18,top+5,size*.62,9,'#a8d49b');}}
      for(let i=0;i<14;i++){const x=((i*91-camera*.48)%(W+100)+W+100)%(W+100)-50;rect(x,425+(i%3)*8,5,5,'#e8efae');rect(x+10,431+(i%2)*8,4,4,'#f4f0bd');}
    }
    function drawPlatform(p){const x=p.x-camera;if(x+p.w<0||x>W)return;if(p.y===FLOOR){rect(x,p.y,p.w,p.h,'#604b39');rect(x,p.y,p.w,15,'#5c9b56');rect(x,p.y+15,p.w,8,'#82ba5d');rect(x,p.y+23,p.w,5,'#6b9850');for(let xx=x+12;xx<x+p.w;xx+=48){rect(xx,p.y+42,17,5,'#785b43');rect(xx+23,p.y+77,8,4,'#4f4537');}for(let xx=x+20;xx<x+p.w;xx+=79){rect(xx,p.y-5,7,7,'#a4cd67');rect(xx+6,p.y-3,7,5,'#78b766');}}else{rect(x,p.y,p.w,p.h,'#735c42');rect(x,p.y,p.w,6,'#6da65a');rect(x+4,p.y+6,p.w-8,4,'#8cc465');rect(x+9,p.y+13,11,3,'#94744c');rect(x+p.w-25,p.y+10,13,3,'#94744c');}}
    function drawDew(d){if(d.got)return;const x=d.x-camera,y=d.y+Math.sin(time*.08+d.phase)*3;ctx.fillStyle='#f4d86b';ctx.fillRect(Math.round(x-5),Math.round(y-7),10,12);ctx.fillStyle='#fff3a6';ctx.fillRect(Math.round(x-2),Math.round(y-5),3,4);ctx.fillStyle='#e79e55';ctx.fillRect(Math.round(x-3),Math.round(y+5),6,2);}
    function drawEnemy(e){if(!e.alive)return;const x=e.x-camera,y=e.y;rect(x+5,y+17,21,10,'#70434a');rect(x+1,y+11,29,12,'#bd6661');rect(x+6,y+5,18,11,'#e18573');rect(x+7,y+7,5,5,'#fff0c4');rect(x+19,y+7,5,5,'#fff0c4');rect(x+9,y+8,3,4,'#3f3d3b');rect(x+20,y+8,3,4,'#3f3d3b');rect(x+4,y+24,8,4,'#493f3b');rect(x+20,y+24,8,4,'#493f3b');rect(x+13,y+18,5,2,'#873f48');}
    function drawPlayer(){if(player.invuln>0&&Math.floor(player.invuln/7)%2===0)return;const x=player.x-camera,y=player.y;ctx.save();ctx.translate(Math.round(x+player.w/2),Math.round(y+player.h/2));ctx.scale(player.facing,1);ctx.rotate(player.grounded?Math.sin(player.anim)*.07:player.vy*.012);ctx.translate(-player.w/2,-player.h/2);
      // Tiny leaf sprite, assembled from crisp blocks.
      rect(12,23,10,5,'#bd8c59');rect(7,17,20,8,'#238254');rect(4,10,27,11,'#41ad65');rect(9,5,21,9,'#5cc873');rect(16,1,13,8,'#79d778');rect(3,13,8,6,'#66cb77');rect(27,9,5,8,'#2b9158');rect(9,9,4,4,'#b1ed90');rect(15,10,3,10,'#b3e584');rect(17,9,2,11,'#e0e99a');rect(23,11,3,3,'#f5f1c8');rect(25,12,2,2,'#394438');rect(13,12,3,2,'#f5f1c8');rect(15,12,2,2,'#394438');
      ctx.restore();}
    function drawGoal(){const x=3500-camera;rect(x,277,7,185,'#74583d');rect(x+7,285,61,37,'#eff0b5');rect(x+7,285,52,7,'#e3e69b');rect(x+7,292,7,20,'#e3e69b');rect(x+54,292,14,30,'#c3da7c');rect(x+13,300,34,6,'#8fa95b');rect(x-13,449,32,13,'#70533a');rect(x+5,265,7,13,'#f4d86b');}
    function draw(){drawBackground();for(const p of platforms)drawPlatform(p);dewSpots.forEach(drawDew);drawGoal();enemies.forEach(drawEnemy);drawPlayer();}
    function frame(ts){const dt=Math.min(2,(ts-last)/16.67||1);last=ts;update(dt);draw();requestAnimationFrame(frame);}
    resetWorld();requestAnimationFrame(frame);
    // Scale the backing store for crisp pixels on high density screens while preserving the logical game world.
    const resize=()=>{const r=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.imageSmoothingEnabled=false;};
    new ResizeObserver(resize).observe(document.getElementById('viewport'));resize();
  })();
  </script>
</body>
</html>
